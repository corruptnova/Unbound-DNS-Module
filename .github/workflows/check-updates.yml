# Daily: if Unbound or a bundled library has a new release, pin it, commit
# versions.env to main, build, test and publish a release. The manager's
# update check (updateJson) then offers it to every installation.
name: check-updates

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-updates

jobs:
  bump:
    # Only act on main, so nothing is published from other branches.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
      release: ${{ steps.release.outputs.needed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - id: bump
        name: Look for new upstream releases
        run: scripts/update-versions.sh
      - id: commit
        name: Commit versions.env
        run: |
          if [ "${{ steps.bump.outputs.changed }}" = true ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Update to ${{ steps.bump.outputs.version }}: ${{ steps.bump.outputs.summary }}"
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: release
        name: Is a release needed?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.bump.outputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: bump
    if: needs.bump.outputs.release == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.bump.outputs.sha }}

  publish:
    needs: [bump, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: module
          path: dist/
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.bump.outputs.version }}" dist/* --repo "${{ github.repository }}" \
            --target "${{ needs.bump.outputs.sha }}" --title "${{ needs.bump.outputs.version }}" \
            --notes-file dist/changelog.md
