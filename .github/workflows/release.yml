# Publish a release for the current versions.env. Runs on a pushed tag
# (v<unbound>-r<rev>) or by hand, e.g. after bumping MODULE_REVISION.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: module
          path: dist/
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/.*"version": "\(.*\)".*/\1/p' dist/update.json)"
          if [ "${{ github.ref_type }}" = tag ] && [ "${{ github.ref_name }}" != "$version" ]; then
            echo "::error::tag ${{ github.ref_name }} does not match versions.env ($version)"
            exit 1
          fi
          gh release create "$version" dist/* --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" --title "$version" --notes-file dist/changelog.md
