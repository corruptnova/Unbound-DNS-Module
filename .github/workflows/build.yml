# Reusable: test, cross-compile all ABIs, package, and smoke-test on an
# emulator. Called by ci.yml, release.yml and check-updates.yml.
name: build

on:
  workflow_call:
    inputs:
      ref:
        description: 'Commit to build (default: the triggering commit)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - name: Pin any missing source checksums
        run: |
          scripts/update-versions.sh --fill
          if ! git diff --quiet versions.env; then
            echo "::warning title=Unpinned sources::versions.env had empty sha256 pins; they were filled from this download. Commit them:"
            git diff versions.env
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: versions
          path: versions.env

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - name: Install test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox toybox shellcheck unbound dnsutils >/dev/null
          sudo systemctl stop unbound || true
      - name: shellcheck
        run: |
          shellcheck -S warning -x -P scripts scripts/*.sh tests/emulator/smoke.sh
          shellcheck -S warning -s dash -x module/ctl.sh module/lib/*.sh module/service.sh \
            module/action.sh module/uninstall.sh module/customize.sh \
            tests/*.sh tests/stubs/getprop tests/stubs/getevent tests/stubs/inotifyd tests/stubs/iptables tests/stubs/iptables-save tests/stubs/settings \
            tests/stubs/chcon tests/stubs/runcon tests/stubs/dmesg tests/stubs/logcat tests/stubs/bin/*
      - name: Shell tests (busybox ash)
        run: sudo sh tests/run.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
      - name: WebUI test
        run: |
          npm install --no-save --prefix tests/webui playwright@1.63.0
          npx --prefix tests/webui playwright install --with-deps chromium
          node tests/webui/webui.test.cjs --screenshots webui-screenshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: webui-screenshots
          path: webui-screenshots/
          if-no-files-found: ignore

  build:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: versions
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .cache/src
          key: src-${{ hashFiles('versions.env') }}
      - name: Build ${{ matrix.abi }}
        run: scripts/build.sh ${{ matrix.abi }}
      - name: Show binaries
        run: |
          file out/${{ matrix.abi }}/unbound out/${{ matrix.abi }}/unbound-control out/${{ matrix.abi }}/unbound-anchor out/${{ matrix.abi }}/curl
          cat out/${{ matrix.abi }}/BUILDINFO
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: bin-${{ matrix.abi }}
          path: out/${{ matrix.abi }}/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: failure()
        with:
          name: build-logs-${{ matrix.abi }}
          path: build/${{ matrix.abi }}/*.log

  package:
    needs: [versions, test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: versions
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: bin-*
          path: out/
      - name: Package
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          for d in out/bin-*; do mv "$d" "out/${d#out/bin-}"; done
          scripts/package.sh
          ls -la dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: module
          path: dist/

  emulator:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: module
          path: dist/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Static busybox for the device
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox-static >/dev/null
          file /bin/busybox
      - name: Smoke test on Android 14 (x86_64)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -dns-server 8.8.8.8,1.1.1.1
          script: bash tests/emulator/smoke.sh "$(ls dist/unbound-dns-*.zip)"
