# Reusable: test, cross-compile all ABIs, package, and smoke-test on an
# emulator. Called by ci.yml, release.yml and check-updates.yml.
name: build

on:
  workflow_call:
    inputs:
      ref:
        description: 'Commit to build (default: the triggering commit)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Pin any missing source checksums
        run: |
          scripts/update-versions.sh --fill
          if ! git diff --quiet versions.env; then
            echo "::warning title=Unpinned sources::versions.env had empty sha256 pins; they were filled from this download. Commit them:"
            git diff versions.env
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: versions
          path: versions.env

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Install test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox shellcheck unbound dnsutils >/dev/null
          sudo systemctl stop unbound || true
      - name: shellcheck
        run: |
          shellcheck -S warning -x -P scripts scripts/*.sh tests/emulator/smoke.sh
          shellcheck -S warning -s dash -x module/ctl.sh module/lib/*.sh module/service.sh \
            module/action.sh module/uninstall.sh module/customize.sh \
            tests/*.sh tests/stubs/getprop tests/stubs/iptables tests/stubs/settings tests/stubs/bin/*
      - name: Shell tests (busybox ash)
        run: sudo sh tests/run.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: WebUI test
        run: |
          npm install --no-save --prefix tests/webui playwright@1.63.0
          npx --prefix tests/webui playwright install --with-deps chromium
          node tests/webui/webui.test.cjs --screenshots webui-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webui-screenshots
          path: webui-screenshots/
          if-no-files-found: ignore

  build:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: versions
      - uses: actions/cache@v4
        with:
          path: .cache/src
          key: src-${{ hashFiles('versions.env') }}
      - name: Build ${{ matrix.abi }}
        run: scripts/build.sh ${{ matrix.abi }}
      - name: Show binaries
        run: |
          file out/${{ matrix.abi }}/unbound out/${{ matrix.abi }}/unbound-control out/${{ matrix.abi }}/curl
          cat out/${{ matrix.abi }}/BUILDINFO
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.abi }}
          path: out/${{ matrix.abi }}/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs-${{ matrix.abi }}
          path: build/${{ matrix.abi }}/*.log

  package:
    needs: [versions, test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: versions
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: out/
      - name: Package
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          for d in out/bin-*; do mv "$d" "out/${d#out/bin-}"; done
          scripts/package.sh
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: module
          path: dist/

  emulator:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: module
          path: dist/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Static busybox for the device
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox-static >/dev/null
          file /bin/busybox
      - name: Smoke test on Android 14 (x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: bash tests/emulator/smoke.sh "$(ls dist/unbound-dns-*.zip)"
