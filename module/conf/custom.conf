# Your own Unbound settings. This file is never overwritten by the module.
# It is read after the module's configuration, so settings here win, except
# where Unbound runs: username, chroot, directory, pidfile, logfile,
# do-daemonize, port, interface, include and remote-control belong to the
# module, and a custom.conf that sets any of them is not used.
# Restart Unbound after editing (WebUI, or: ctl.sh restart).
#
# Examples:
#
# Protect against DNS rebinding (can break services that hand out private
# addresses on purpose, e.g. plex.direct):
#
# server:
#     private-address: 10.0.0.0/8
#     private-address: 172.16.0.0/12
#     private-address: 192.168.0.0/16
#     private-address: 169.254.0.0/16
#     private-address: fd00::/8
#     private-address: fe80::/10
#
# Resolve a local domain through your router:
#
# server:
#     domain-insecure: "lan"
# forward-zone:
#     name: "lan"
#     forward-addr: 192.168.1.1
