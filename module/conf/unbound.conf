# Unbound DNS module: main configuration.
#
# This file is replaced on every start and on module updates. Put your own
# settings in /data/adb/unbound/custom.conf instead; it is read last, so it
# can override anything here.
#
# Unbound chroots to /data/adb/unbound and then runs as the "inet" user
# (uid 3003). Paths below include the chroot prefix, as Unbound requires.

server:
    # --- where it runs ---------------------------------------------------------
    chroot: "/data/adb/unbound"
    directory: "/data/adb/unbound"
    username: "inet"
    pidfile: ""
    logfile: "/data/adb/unbound/var/unbound.log"
    use-syslog: no
    log-time-ascii: yes
    verbosity: 1
    do-daemonize: no

    # Listening addresses (127.0.0.1 and, when present, ::1 on port 5335)
    # are generated into runtime.conf at start.
    port: 5335
    # Redirected queries keep the phone's own Wi-Fi/mobile address as their
    # source, so every source must be allowed. This is safe because Unbound
    # only listens on loopback: nothing off the phone can reach it.
    access-control: 0.0.0.0/0 allow
    access-control: ::/0 allow

    # --- a phone has one user and little memory ----------------------------
    num-threads: 1
    msg-cache-size: 8m
    rrset-cache-size: 16m
    key-cache-size: 4m
    neg-cache-size: 1m
    infra-cache-numhosts: 2000
    outgoing-range: 512
    num-queries-per-thread: 256
    so-reuseport: no
    edns-buffer-size: 1232

    # --- privacy -------------------------------------------------------------
    qname-minimisation: yes
    aggressive-nsec: yes
    hide-identity: yes
    hide-version: yes
    hide-trustanchor: yes
    minimal-responses: yes
    log-queries: no
    log-replies: no

    # --- DNSSEC --------------------------------------------------------------
    auto-trust-anchor-file: "/data/adb/unbound/var/root.key"
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes

    # --- speed on flaky mobile links -------------------------------------------
    prefetch: yes
    prefetch-key: yes
    serve-expired: yes
    serve-expired-ttl: 86400
    serve-expired-client-timeout: 1800

include: "/data/adb/unbound/runtime.conf"
include: "/data/adb/unbound/control.conf"
include: "/data/adb/unbound/blocklist.conf"
include: "/data/adb/unbound/custom.conf"
